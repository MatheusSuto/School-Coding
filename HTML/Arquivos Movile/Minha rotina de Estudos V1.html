<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Rotina de Estudos</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Estilização suave da barra de rolagem */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        /* Animações customizadas */
        .task-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .task-card:active {
            transform: scale(0.98);
        }

        /* Estilos de transição de remoção */
        .task-exit {
            opacity: 0;
            transform: translateX(30px);
            max-height: 0;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            overflow: hidden;
        }

        /* Animação suave no carregamento da lista */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="h-full text-slate-800 flex justify-center items-center sm:py-6">

    <!-- Mobile Frame Simulation Container -->
    <div
        class="w-full max-w-md h-full sm:h-[844px] bg-slate-50 sm:rounded-[36px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-[8px] sm:border-slate-800">

        <!-- Status Bar Simulada para Desktop View -->
        <div
            class="bg-indigo-600 text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold select-none">
            <span id="current-time">09:41</span>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Header do App -->
        <header class="bg-indigo-600 text-white px-6 pt-2 pb-6 rounded-b-[28px] shadow-md relative z-10">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Minha Rotina</h1>
                    <p class="text-indigo-200 text-xs font-medium">Organizador Escolar & Estudos</p>
                </div>
                <div
                    class="w-10 h-10 rounded-full bg-indigo-500/50 flex items-center justify-center border border-indigo-400/30">
                    <i class="fa-solid fa-graduation-cap text-lg text-white"></i>
                </div>
            </div>

            <!-- Dashboard / Card de Resumo de Progresso -->
            <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/15 text-white">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-medium text-indigo-100">Progresso dos Estudos</span>
                    <span id="progress-percent" class="text-xs font-bold text-white">0%</span>
                </div>
                <!-- Barra de Progresso -->
                <div class="w-full bg-indigo-900/40 rounded-full h-2.5 overflow-hidden mb-3">
                    <div id="progress-bar" class="bg-emerald-400 h-2.5 rounded-full transition-all duration-500 w-0">
                    </div>
                </div>
                <!-- Contadores -->
                <div class="grid grid-cols-2 gap-2 text-center pt-1 border-t border-white/10">
                    <div>
                        <span id="pending-count" class="text-xl font-extrabold block text-white">0</span>
                        <span
                            class="text-[10px] uppercase tracking-wider text-indigo-200 font-semibold">Pendentes</span>
                    </div>
                    <div>
                        <span id="completed-count" class="text-xl font-extrabold block text-emerald-300">0</span>
                        <span
                            class="text-[10px] uppercase tracking-wider text-indigo-200 font-semibold">Concluídas</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filtros Rápidos -->
        <div class="px-5 pt-4 pb-2 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
            <button onclick="setFilter('all')" id="filter-all"
                class="filter-btn flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm">
                Todas (<span id="count-all">0</span>)
            </button>
            <button onclick="setFilter('pending')" id="filter-pending"
                class="filter-btn flex-1 py-2 px-3 rounded-xl text-xs font-semibold transition-all bg-slate-200 text-slate-600 hover:bg-slate-300">
                Pendentes
            </button>
            <button onclick="setFilter('completed')" id="filter-completed"
                class="filter-btn flex-1 py-2 px-3 rounded-xl text-xs font-semibold transition-all bg-slate-200 text-slate-600 hover:bg-slate-300">
                Concluídas
            </button>
        </div>

        <!-- Container Principal da Lista de Tarefas -->
        <main class="flex-1 overflow-y-auto px-5 py-2 space-y-3" id="task-list-container">
            <!-- As tarefas serão renderizadas via JavaScript aqui -->
        </main>

        <!-- Floating Action Button (FAB) para Adicionar -->
        <div class="absolute bottom-6 right-6 z-20">
            <button onclick="openModal()"
                class="w-14 h-14 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-full shadow-lg shadow-indigo-500/40 flex items-center justify-center transition-all duration-200 focus:outline-none"
                aria-label="Adicionar Tarefa">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>
        </div>

        <!-- Modal de Cadastro de Tarefas -->
        <div id="modal-backdrop"
            class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex justify-center items-end sm:items-center p-0 sm:p-4">
            <div id="modal-card"
                class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform translate-y-full sm:translate-y-4 transition-transform duration-300 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-indigo-600"></i> Nova Tarefa Escolar
                    </h2>
                    <button onclick="closeModal()"
                        class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Formulário -->
                <form id="add-task-form" onsubmit="handleAddTask(event)" class="space-y-4">
                    <!-- Nome da Tarefa -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                            for="task-title">
                            Nome da Tarefa / Atividade
                        </label>
                        <input type="text" id="task-title" required
                            placeholder="Ex: Exercícios pág 42, Trabalho de História..."
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-sm font-medium bg-slate-50/50">
                    </div>

                    <!-- Disciplina -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                            for="task-subject">
                            Disciplina / Matéria
                        </label>
                        <select id="task-subject" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-sm font-medium bg-slate-50/50">
                            <option value="" disabled selected>Selecione a matéria</option>
                            <option value="Matemática">📐 Matemática</option>
                            <option value="Português">📖 Português / Literatura</option>
                            <option value="História">🏛️ História</option>
                            <option value="Geografia">🌍 Geografia</option>
                            <option value="Ciências">🔬 Ciências / Biologia</option>
                            <option value="Física">⚡ Física</option>
                            <option value="Química">🧪 Química</option>
                            <option value="Inglês">💬 Inglês / Idiomas</option>
                            <option value="Artes">🎨 Artes</option>
                            <option value="Outros">📌 Outros</option>
                        </select>
                    </div>

                    <!-- Data de Entrega -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5"
                            for="task-due-date">
                            Data de Entrega
                        </label>
                        <input type="date" id="task-due-date" required
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all text-sm font-medium bg-slate-50/50">
                    </div>

                    <!-- Botão Salvar -->
                    <div class="pt-3">
                        <button type="submit"
                            class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2 text-base">
                            <i class="fa-solid fa-check"></i> Adicionar Tarefa
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast"
            class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-message">Tarefa salva com sucesso!</span>
        </div>

    </div>

    <script>
        // --- ESTADO DA APLICAÇÃO ---
        let tasks = [];
        let currentFilter = 'all';

        // Mapeamento de cores por disciplina
        const subjectColors = {
            'Matemática': { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-200' },
            'Português': { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-200' },
            'História': { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-200' },
            'Geografia': { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-200' },
            'Ciências': { bg: 'bg-teal-100', text: 'text-teal-700', border: 'border-teal-200' },
            'Física': { bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-200' },
            'Química': { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-200' },
            'Inglês': { bg: 'bg-cyan-100', text: 'text-cyan-700', border: 'border-cyan-200' },
            'Artes': { bg: 'bg-pink-100', text: 'text-pink-700', border: 'border-pink-200' },
            'Outros': { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200' }
        };

        // --- DADOS INICIAIS DE EXEMPLO (Mock Data) ---
        const defaultTasks = [
            {
                id: '1',
                title: 'Resumo dos Capítulos 3 e 4 do livro de História',
                subject: 'História',
                dueDate: getFormattedOffsetDate(1), // Amanhã
                completed: false,
                createdAt: new Date().toISOString()
            },
            {
                id: '2',
                title: 'Lista de exercícios de Equações do 2º Grau',
                subject: 'Matemática',
                dueDate: getFormattedOffsetDate(0), // Hoje
                completed: false,
                createdAt: new Date().toISOString()
            },
            {
                id: '3',
                title: 'Trabalho em grupo sobre Células Tronco',
                subject: 'Ciências',
                dueDate: getFormattedOffsetDate(-1), // Atrasado
                completed: false,
                createdAt: new Date().toISOString()
            },
            {
                id: '4',
                title: 'Leitura do capítulo de Literatura',
                subject: 'Português',
                dueDate: getFormattedOffsetDate(5),
                completed: true,
                createdAt: new Date().toISOString()
            }
        ];

        // Auxiliar para gerar datas relativas
        function getFormattedOffsetDate(daysOffset) {
            const date = new Date();
            date.setDate(date.getDate() + daysOffset);
            return date.toISOString().split('T')[0];
        }

        // Inicialização do App
        window.onload = function () {
            updateClock();
            setInterval(updateClock, 1000);

            // Carregar do localStorage ou usar mock data inicial
            const savedTasks = localStorage.getItem('minha_rotina_tasks');
            if (savedTasks) {
                try {
                    tasks = JSON.parse(savedTasks);
                } catch (e) {
                    tasks = defaultTasks;
                }
            } else {
                tasks = defaultTasks;
                saveTasksToStorage();
            }

            // Define data mínima para o input de data como hoje
            document.getElementById('task-due-date').min = new Date().toISOString().split('T')[0];

            render();
        };

        // Salvar dados no localStorage
        function saveTasksToStorage() {
            localStorage.setItem('minha_rotina_tasks', JSON.stringify(tasks));
        }

        // Atualizar Relógio Simulado
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const clockEl = document.getElementById('current-time');
            if (clockEl) clockEl.innerText = `${hours}:${minutes}`;
        }

        // Abrir Modal
        function openModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const card = document.getElementById('modal-card');
            backdrop.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('translate-y-full', 'sm:translate-y-4');
            card.classList.add('translate-y-0');
        }

        // Fechar Modal
        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const card = document.getElementById('modal-card');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('translate-y-0');
            card.classList.add('translate-y-full', 'sm:translate-y-4');
            document.getElementById('add-task-form').reset();
        }

        // Handler do Formulário de Adicionar Tarefa
        function handleAddTask(e) {
            e.preventDefault();

            const title = document.getElementById('task-title').value.trim();
            const subject = document.getElementById('task-subject').value;
            const dueDate = document.getElementById('task-due-date').value;

            if (!title || !subject || !dueDate) return;

            const newTask = {
                id: Date.now().toString(),
                title,
                subject,
                dueDate,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(newTask);
            saveTasksToStorage();
            closeModal();
            render();
            showToast('Nova tarefa cadastrada com sucesso!');
        }

        // Alternar Estado de Concluído
        function toggleTask(id) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    return { ...t, completed: !t.completed };
                }
                return t;
            });
            saveTasksToStorage();
            render();
        }

        // Excluir Tarefa com Animação
        function deleteTask(id) {
            const el = document.getElementById(`task-item-${id}`);
            if (el) {
                el.classList.add('task-exit');
                setTimeout(() => {
                    tasks = tasks.filter(t => t.id !== id);
                    saveTasksToStorage();
                    render();
                    showToast('Tarefa removida!');
                }, 250);
            }
        }

        // Filtrar Tarefas
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-slate-200', 'text-slate-600');
            });

            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-200', 'text-slate-600');
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
            }

            renderTaskList();
        }

        // Formatar Data e Calcular Indicador de Urgência
        function getDueDateBadge(dueDateStr, completed) {
            if (completed) {
                return `<span class="px-2 py-0.5 text-[11px] font-medium rounded-md bg-emerald-100 text-emerald-700">Concluída</span>`;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const [year, month, day] = dueDateStr.split('-').map(Number);
            const due = new Date(year, month - 1, day);
            due.setHours(0, 0, 0, 0);

            const diffTime = due.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const formattedDate = `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}`;

            if (diffDays < 0) {
                return `<span class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-rose-100 text-rose-700 flex items-center gap-1">
                            <i class="fa-solid fa-triangle-exclamation"></i> Atrasado (${formattedDate})
                        </span>`;
            } else if (diffDays === 0) {
                return `<span class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-amber-100 text-amber-700 flex items-center gap-1">
                            <i class="fa-regular fa-clock"></i> Entrega Hoje!
                        </span>`;
            } else if (diffDays === 1) {
                return `<span class="px-2 py-0.5 text-[11px] font-semibold rounded-md bg-indigo-100 text-indigo-700">
                            Amanhã
                        </span>`;
            } else {
                return `<span class="px-2 py-0.5 text-[11px] font-medium rounded-md bg-slate-100 text-slate-600">
                            Entrega: ${formattedDate}
                        </span>`;
            }
        }

        // Renderizar Lista e Estatísticas
        function render() {
            renderDashboard();
            renderTaskList();
        }

        // Atualizar Contadores do Dashboard
        function renderDashboard() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById('pending-count').innerText = pending;
            document.getElementById('completed-count').innerText = completed;
            document.getElementById('count-all').innerText = total;

            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        // Renderizar Lista de Tarefas com Ordenação
        function renderTaskList() {
            const container = document.getElementById('task-list-container');

            // Filtragem
            let filteredTasks = tasks.filter(t => {
                if (currentFilter === 'pending') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            // Ordenação: Pendentes primeiro, depois ordenado por prazo de entrega mais próximo
            filteredTasks.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-center text-slate-400">
                        <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mb-3 text-slate-300 text-2xl">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </div>
                        <p class="text-sm font-semibold text-slate-600">Nenhuma tarefa por aqui!</p>
                        <p class="text-xs text-slate-400 mt-1">Toque no botão "+" abaixo para cadastrar.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredTasks.map(task => {
                const subjectStyle = subjectColors[task.subject] || subjectColors['Outros'];
                const dueDateBadge = getDueDateBadge(task.dueDate, task.completed);

                return `
                    <div id="task-item-${task.id}" class="task-card bg-white p-4 rounded-2xl border border-slate-100 shadow-xs hover:shadow-md flex items-start justify-between gap-3 animate-fade-in ${task.completed ? 'opacity-65' : ''}">
                        
                        <!-- Checkbox e Conteúdo -->
                        <div class="flex items-start gap-3 flex-1 min-w-0">
                            <!-- Botão Checkbox -->
                            <button onclick="toggleTask('${task.id}')" aria-label="Marcar como concluída" 
                                class="mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-colors shrink-0 
                                ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-500 text-transparent'}">
                                <i class="fa-solid fa-check text-xs"></i>
                            </button>

                            <!-- Informações da Tarefa -->
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                                    <!-- Badge Disciplina -->
                                    <span class="px-2 py-0.5 text-[10px] font-bold rounded-md ${subjectStyle.bg} ${subjectStyle.text}">
                                        ${task.subject}
                                    </span>
                                    <!-- Badge Urgência / Prazo -->
                                    ${dueDateBadge}
                                </div>

                                <h3 class="text-sm font-semibold text-slate-800 leading-snug break-words ${task.completed ? 'line-through text-slate-400' : ''}">
                                    ${escapeHtml(task.title)}
                                </h3>
                            </div>
                        </div>

                        <!-- Botão de Excluir -->
                        <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-rose-500 p-1.5 transition-colors shrink-0 rounded-lg hover:bg-rose-50" title="Excluir tarefa">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Função Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Auxiliar para Segurança (Evitar XSS)
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function (m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>

</html>
