<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Rotina de Estudos</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --text-muted: #6B7280;
      --danger: #EF4444;
      --border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* Simulação de tela de Celular */
    .mobile-frame {
      width: 100%;
      max-width: 414px;
      height: 844px;
      background-color: var(--bg);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 8px solid #374151;
    }

    header {
      background-color: var(--primary);
      color: white;
      padding: 24px 20px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .counter-badge {
      display: inline-block;
      margin-top: 8px;
      background-color: rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-add {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      min-height: 48px; /* Acessibilidade Touch */
      transition: background 0.2s;
    }

    .btn-add:active {
      background-color: var(--primary-hover);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background-color: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      gap: 12px;
    }

    .task-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .task-title {
      font-weight: 600;
      color: var(--text);
      font-size: 1rem;
    }

    .task-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .btn-delete {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .btn-delete:active {
      background-color: #FEE2E2;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 32px 0;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <header>
      <h1>Minha Rotina de Estudos</h1>
      <div class="counter-badge" id="task-counter">Faltam 0 tarefas</div>
    </header>

    <main>
      <div class="card">
        <form id="task-form" class="form-group">
          <input type="text" id="task-name" placeholder="Nome da tarefa" required>
          <input type="text" id="task-subject" placeholder="Disciplina (ex: Matemática)" required>
          <input type="date" id="task-date" required>
          <button type="submit" class="btn-add">Adicionar Tarefa</button>
        </form>
      </div>

      <ul class="task-list" id="task-list"></ul>
    </main>
  </div>

  <script>
    // Recupera do localStorage ou inicia com lista vazia
    let tasks = JSON.parse(localStorage.getItem('study_routine_tasks')) || [];

    const taskForm = document.getElementById('task-form');
    const taskList = document.getElementById('task-list');
    const taskCounter = document.getElementById('task-counter');

    function saveTasks() {
      localStorage.setItem('study_routine_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => 
        task.id === id ? { ...task, completed: !task.completed } : task
      );
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
    }

    function renderTasks() {
      taskList.innerHTML = '';
      
      const pendingTasks = tasks.filter(task => !task.completed).length;
      taskCounter.textContent = `Faltam ${pendingTasks} tarefa${pendingTasks !== 1 ? 's' : ''}`;

      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state">Nenhuma tarefa cadastrada por enquanto!</div>';
        return;
      }

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;

        const formattedDate = task.date ? task.date.split('-').reverse().join('/') : '';

        li.innerHTML = `
          <input 
            type="checkbox" 
            ${task.completed ? 'checked' : ''} 
            onchange="toggleTask(${task.id})"
            aria-label="Marcar tarefa como concluída"
          >
          <div class="task-info">
            <span class="task-title">${task.title}</span>
            <span class="task-meta">${task.subject} • Entrega: ${formattedDate}</span>
          </div>
          <button 
            class="btn-delete" 
            onclick="deleteTask(${task.id})" 
            aria-label="Excluir tarefa"
          >🗑️</button>
        `;

        taskList.appendChild(li);
      });
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newTask = {
        id: Date.now(),
        title: document.getElementById('task-name').value,
        subject: document.getElementById('task-subject').value,
        date: document.getElementById('task-date').value,
        completed: false
      };

      tasks.push(newTask);
      saveTasks();
      taskForm.reset();
    });

    renderTasks();
  </script>
</body>
</html>
